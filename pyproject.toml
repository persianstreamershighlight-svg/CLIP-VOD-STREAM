[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persian-kick-vod-clipper"
version = "1.0.0"
description = "Traceable, document-governed Persian Kick VOD clipping pipeline"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3", "pydantic-settings>=2.2,<3", "typer>=0.12,<1",
  "yt-dlp>=2024.8.6", "faster-whisper>=1.0,<2", "requests>=2.32,<3",
  "python-docx>=1.1,<2", "google-api-python-client>=2.140,<3",
  "google-auth>=2.33,<3", "streamlit>=1.37,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
persian-kick-clipper = "persian_kick_vod_clipper.main:app"

[tool.setuptools.packages.find]
include = ["persian_kick_vod_clipper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

